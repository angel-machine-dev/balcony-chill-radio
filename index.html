<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Η Βεράντα & ο Κήπος | Chill Radio & Live Clock</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Georgia', 'Segoe UI', serif; }
        body {
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: #ffffff;
            background-color: #1a241b;
            position: relative;
        }

        /* Background Photo Layers (Garden & Flowers Courtyard) */
        .bg-layer {
            position: fixed;
            inset: 0;
            background-size: cover;
            background-position: center bottom;
            transition: opacity 1.8s ease, filter 1.8s ease;
            z-index: 1;
        }
        /* Lush blooming courtyard garden */
        .bg-image {
            background-image: url('https://unsplash.com');
        }
        body.morning .bg-image { filter: brightness(1.05) saturate(1.1) sepia(0.12); }
        body.day .bg-image { filter: brightness(1.1) saturate(1.15); }
        body.sunset .bg-image { filter: brightness(0.88) saturate(1.35) sepia(0.35) hue-rotate(-12deg); }
        body.night .bg-image { filter: brightness(0.35) saturate(0.85) hue-rotate(195deg); }

        /* Atmospheric Lighting Overlay (Rapture Golden Sunbeams & Night Glow) */
        .light-overlay {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            transition: background 1.8s ease;
        }
        body.morning .light-overlay { background: radial-gradient(circle at 80% 15%, rgba(255, 244, 194, 0.45), transparent 60%); }
        body.day .light-overlay { background: radial-gradient(circle at 75% 10%, rgba(255, 255, 255, 0.25), transparent 65%); }
        body.sunset .light-overlay { background: linear-gradient(180deg, rgba(251, 146, 60, 0.35) 0%, rgba(190, 24, 93, 0.2) 50%, rgba(15, 23, 42, 0.5) 100%); }
        body.night .light-overlay { background: radial-gradient(circle at 20% 85%, rgba(253, 224, 71, 0.22), rgba(9, 13, 22, 0.75) 70%); }

        /* Floating Golden Light Motes (Rapture vibe) */
        .motes { position: fixed; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; }
        .mote {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 248, 200, 0.95) 0%, rgba(253, 224, 71, 0) 70%);
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.6); opacity: 0; }
            25% { opacity: 0.85; }
            75% { opacity: 0.85; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        /* Rain effect */
        .rain { position: fixed; inset: 0; z-index: 4; pointer-events: none; display: none; background: repeating-linear-gradient(102deg, transparent 0px, transparent 22px, rgba(255,255,255,0.22) 23px, transparent 24px); animation: rainFall 0.55s linear infinite; }
        body.raining .rain { display: block; }
        @keyframes rainFall { from { background-position: 0 0; } to { background-position: -24px 48px; } }

        /* Top Bar */
        .top-bar { z-index: 10; display: flex; justify-content: space-between; align-items: flex-start; padding: 26px 34px; flex-wrap: wrap; gap: 14px; }
        .clock-box {
            background: rgba(20, 25, 22, 0.45);
            backdrop-filter: blur(12px);
            padding: 18px 26px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            box-shadow: 0 8px 30px rgba(0,0,0,0.25);
        }
        .time { font-size: 48px; font-weight: 700; letter-spacing: 2px; line-height: 1; font-family: 'Segoe UI', sans-serif; }
        .date { font-size: 15px; opacity: 0.92; margin-top: 6px; text-transform: capitalize; font-family: 'Segoe UI', sans-serif; }

        .weather-controls {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            background: rgba(20, 25, 22, 0.45);
            backdrop-filter: blur(12px);
            padding: 8px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.22);
        }
        .weather-controls button {
            background: transparent;
            border: none;
            color: white;
            padding: 7px 11px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            font-family: 'Segoe UI', sans-serif;
            transition: 0.2s;
        }
        .weather-controls button.active, .weather-controls button:hover { background: rgba(255, 255, 255, 0.25); }
        /* Balcony Foreground & Radio Player */
        .bottom-area {
            z-index: 10;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 16px 28px;
            background: linear-gradient(180deg, transparent 0%, rgba(15, 20, 16, 0.72) 100%);
        }
        .radio-card {
            background: rgba(24, 28, 25, 0.72);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 20px 26px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.45);
        }
        .radio-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .station-title { font-size: 15px; font-weight: 700; color: #fef08a; font-family: 'Segoe UI', sans-serif; }
        .status-badge { font-size: 11px; background: rgba(255,255,255,0.12); padding: 3px 9px; border-radius: 12px; font-family: 'Segoe UI', sans-serif; }
        .stations-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
        .station-btn {
            flex: 1;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #f3f4f6;
            padding: 8px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-family: 'Segoe UI', sans-serif;
            cursor: pointer;
            transition: 0.2s;
        }
        .station-btn.active { background: #eab308; color: #111; font-weight: 700; border-color: #eab308; }
        .controls-row { display: flex; align-items: center; gap: 14px; }
        .play-btn {
            background: #eab308;
            color: #111;
            border: none;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 14px rgba(234, 179, 8, 0.4);
        }
        input[type="range"] { flex: 1; accent-color: #eab308; cursor: pointer; }
    </style>
</head>
<body class="day">
    <div class="bg-layer bg-image"></div>
    <div class="light-overlay"></div>
    <div class="motes" id="motes-container"></div>
    <div class="rain"></div>

    <div class="top-bar">
        <div class="clock-box">
            <div class="time" id="clock">00:00</div>
            <div class="date" id="date">Φόρτωση...</div>
        </div>
        <div class="weather-controls">
            <button class="active" onclick="setMode('auto', this)">🕒 Αυτόματο</button>
            <button onclick="setMode('morning', this)">🌅 Πρωί</button>
            <button onclick="setMode('day', this)">☀️ Μέρα</button>
            <button onclick="setMode('sunset', this)">🌇 Δειλινό</button>
            <button onclick="setMode('night', this)">🌙 Νύχτα</button>
            <button onclick="toggleRain(this)">🌧️ Βροχή</button>
        </div>
    </div>

    <div class="bottom-area">
        <div class="radio-card">
            <div class="radio-header">
                <div class="station-title" id="current-station-name">🎹 Peaceful Piano & Strings</div>
                <span class="status-badge" id="radio-status">Έτοιμο</span>
            </div>
            <div class="stations-row">
                <button class="station-btn active" onclick="selectStation(0, this)">🎹 Soft Piano</button>
                <button class="station-btn" onclick="selectStation(1, this)">🌿 Garden Chill</button>
                <button class="station-btn" onclick="selectStation(2, this)">🌙 Night Ambient</button>
            </div>
            <div class="controls-row">
                <button class="play-btn" id="play-btn" onclick="togglePlay()">▶</button>
                <span style="font-size:14px;">🔈</span>
                <input type="range" min="0" max="1" step="0.05" value="0.7" oninput="audio.volume = this.value">
                <span style="font-size:14px;">🔊</span>
            </div>
            <audio id="radio-audio" crossorigin="anonymous" preload="none"></audio>
        </div>
    </div>

<script>
    const stations = [
        { name: "🎹 Peaceful Piano & Strings", url: "https://laut.fm" },
        { name: "🌿 Garden Chillout & Acoustic", url: "https://laut.fm" },
        { name: "🌙 Night Ambient & Meditative", url: "https://laut.fm" }
    ];

    const audio = document.getElementById("radio-audio");
    const playBtn = document.getElementById("play-btn");
    const statusBadge = document.getElementById("radio-status");
    let isPlaying = false;
    let autoTime = true;

    audio.src = stations.url;
    audio.volume = 0.7;

    audio.addEventListener("waiting", () => { statusBadge.textContent = "Φόρτωση..."; });
    audio.addEventListener("playing", () => { statusBadge.textContent = "🟢 Live"; });
    audio.addEventListener("pause", () => { statusBadge.textContent = "Παύση"; });
    audio.addEventListener("error", () => { statusBadge.textContent = "Δοκιμάστε άλλον σταθμό"; });

    function togglePlay() {
        if (!isPlaying) {
            statusBadge.textContent = "Σύνδεση...";
            audio.play().then(() => {
                isPlaying = true;
                playBtn.textContent = "⏸";
            }).catch(() => {
                statusBadge.textContent = "Πατήστε ξανά ▶";
            });
        } else {
            audio.pause();
            isPlaying = false;
            playBtn.textContent = "▶";
        }
    }

    function selectStation(idx, btn) {
        document.querySelectorAll(".station-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("current-station-name").textContent = stations[idx].name;
        audio.src = stations[idx].url;
        if (isPlaying) {
            statusBadge.textContent = "Σύνδεση...";
            audio.play();
        }
    }

    function applySkyByHour(hour) {
        const isRaining = document.body.classList.contains("raining");
        document.body.className = isRaining ? "raining " : "";
        if (hour >= 6 && hour < 12) document.body.classList.add("morning");
        else if (hour >= 12 && hour < 17) document.body.classList.add("day");
        else if (hour >= 17 && hour < 20) document.body.classList.add("sunset");
        else document.body.classList.add("night");
    }

    function setMode(mode, btn) {
        document.querySelectorAll(".weather-controls button:not(:last-child)").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        const isRaining = document.body.classList.contains("raining");
        if (mode === "auto") {
            autoTime = true;
            applySkyByHour(new Date().getHours());
        } else {
            autoTime = false;
            document.body.className = (isRaining ? "raining " : "") + mode;
        }
    }

    function toggleRain(btn) {
        document.body.classList.toggle("raining");
        btn.classList.toggle("active");
    }

    function updateClock() {
        const now = new Date();
        document.getElementById("clock").textContent = now.toLocaleTimeString("el-GR", { hour: "2-digit", minute: "2-digit" });
        document.getElementById("date").textContent = now.toLocaleDateString("el-GR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
        if (autoTime) applySkyByHour(now.getHours());
    }

    // Create floating golden light motes (Rapture aesthetic)
    const motesContainer = document.getElementById("motes-container");
    for (let i = 0; i < 22; i++) {
        const m = document.createElement("div");
        m.className = "mote";
        const size = Math.random() * 14 + 6;
        m.style.width = size + "px";
        m.style.height = size + "px";
        m.style.left = Math.random() * 100 + "vw";
        m.style.animationDuration = (Math.random() * 12 + 10) + "s";
        m.style.animationDelay = (Math.random() * 10) + "s";
        motesContainer.appendChild(m);
    }

    updateClock();
    setInterval(updateClock, 1000);
</script>
</body>
</html>
