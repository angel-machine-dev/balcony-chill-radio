<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Παραλία & Χαλαρωτικό Ραδιόφωνο | Live Clock</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body {
            min-height: 100vh;
            overflow: hidden;
            color: #ffffff;
            background: #0f172a;
            position: relative;
        }

        /* Realistic Beach Background */
        .beach-bg {
            position: fixed;
            inset: 0;
            background-image: url('https://wikimedia.org');
            background-size: cover;
            background-position: center;
            transition: filter 1.6s ease, transform 8s ease;
            z-index: 1;
        }
        body.morning .beach-bg { filter: brightness(1.05) saturate(1.1) sepia(0.15); }
        body.day .beach-bg { filter: brightness(1.08) saturate(1.15); }
        body.sunset .beach-bg { filter: brightness(0.85) saturate(1.45) sepia(0.4) hue-rotate(-18deg); }
        body.night .beach-bg { filter: brightness(0.32) saturate(0.8) hue-rotate(195deg); }
        body.raining .beach-bg { filter: brightness(0.65) saturate(0.75) contrast(1.08); }

        /* Atmospheric Rapture Glow Overlay */
        .atmosphere {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            transition: background 1.6s ease;
        }
        body.morning .atmosphere { background: radial-gradient(circle at 85% 20%, rgba(254, 240, 138, 0.38), transparent 60%); }
        body.day .atmosphere { background: linear-gradient(180deg, rgba(14, 165, 233, 0.12), transparent 50%); }
        body.sunset .atmosphere { background: linear-gradient(180deg, rgba(249, 115, 22, 0.35) 0%, rgba(190, 24, 93, 0.22) 55%, rgba(15, 23, 42, 0.45) 100%); }
        body.night .atmosphere { background: radial-gradient(circle at 80% 18%, rgba(226, 232, 240, 0.22), rgba(2, 6, 23, 0.68) 70%); }

        /* Floating Golden Light Motes */
        .motes { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
        .mote {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 250, 210, 0.9) 0%, rgba(253, 224, 71, 0) 70%);
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            25% { opacity: 0.85; }
            75% { opacity: 0.85; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        /* Realistic Canvas Rain */
        #rain-canvas { position: fixed; inset: 0; z-index: 4; pointer-events: none; }

        /* HUD Layout: Left Clock, Right Weather + Compact Radio */
        .hud {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 24px 30px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .clock-box {
            background: rgba(15, 23, 42, 0.42);
            backdrop-filter: blur(12px);
            padding: 16px 24px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            box-shadow: 0 8px 28px rgba(0,0,0,0.25);
        }
        .time { font-size: 46px; font-weight: 700; letter-spacing: 1.5px; line-height: 1; }
        .date { font-size: 14px; opacity: 0.92; margin-top: 6px; text-transform: capitalize; }

        /* Right Column: Weather Menu + Compact Radio Underneath */
        .right-panel {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            max-width: 100%;
        }
        .weather-controls {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(12px);
            padding: 7px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.22);
        }
        .weather-controls button {
            background: transparent;
            border: none;
            color: white;
            padding: 6px 10px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: 0.2s;
        }
        .weather-controls button.active, .weather-controls button:hover { background: rgba(255, 255, 255, 0.26); }

        /* Compact Radio Box right below Weather Menu */
        .compact-radio {
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 16px;
            padding: 12px 16px;
            width: 340px;
            max-width: 100%;
            box-shadow: 0 10px 28px rgba(0,0,0,0.3);
        }
        .radio-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 12px; }
        .radio-title { font-weight: 700; color: #fde68a; }
        .radio-status { font-size: 11px; opacity: 0.85; }
        .station-pills { display: flex; gap: 5px; margin-bottom: 10px; }
        .station-pills button {
            flex: 1;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            padding: 5px 6px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
        }
        .station-pills button.active { background: #f59e0b; color: #111; font-weight: 700; border-color: #f59e0b; }
        .player-bar { display: flex; align-items: center; gap: 10px; }
        .play-btn {
            background: #f59e0b;
            color: #111;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            flex-shrink: 0;
        }
        input[type="range"] { flex: 1; accent-color: #f59e0b; cursor: pointer; }
    </style>
</head>
<body class="day">
    <div class="beach-bg"></div>
    <div class="atmosphere"></div>
    <div class="motes" id="motes"></div>
    <canvas id="rain-canvas"></canvas>

    <div class="hud">
        <div class="clock-box">
            <div class="time" id="clock">00:00</div>
            <div class="date" id="date">Φόρτωση...</div>
        </div>

        <div class="right-panel">
            <div class="weather-controls">
                <button class="active" onclick="setMode('auto', this)">🕒 Αυτόματο</button>
                <button onclick="setMode('morning', this)">🌅 Πρωί</button>
                <button onclick="setMode('day', this)">☀️ Μέρα</button>
                <button onclick="setMode('sunset', this)">🌇 Δειλινό</button>
                <button onclick="setMode('night', this)">🌙 Νύχτα</button>
                <button onclick="toggleRain(this)">🌧️ Βροχή</button>
            </div>

            <div class="compact-radio">
                <div class="radio-top">
                    <span class="radio-title" id="station-name">🌊 Κύματα & Απαλό Πιάνο</span>
                    <span class="radio-status" id="radio-status">Έτοιμο</span>
                </div>
                <div class="station-pills">
                    <button class="active" onclick="selectChannel(0, this)">🌊 Κύματα & Πιάνο</button>
                    <button onclick="selectChannel(1, this)">🎹 Chill Radio</button>
                    <button onclick="selectChannel(2, this)">🌧️ Βροχή & Ηρεμία</button>
                </div>
                <div class="player-bar">
                    <button class="play-btn" id="play-btn" onclick="toggleAudio()">▶</button>
                    <span style="font-size:12px;">🔈</span>
                    <input type="range" id="vol-slider" min="0" max="1" step="0.05" value="0.6" oninput="updateVolume(this.value)">
                    <span style="font-size:12px;">🔊</span>
                </div>
                <audio id="stream-audio" preload="none"></audio>
            </div>
        </div>
    </div>

<script>
    // Clock & Sky Auto Mode
    let autoTime = true;
    function applySkyByHour(hour) {
        const isRaining = document.body.classList.contains("raining");
        document.body.className = isRaining ? "raining " : "";
        if (hour >= 6 && hour < 12) document.body.classList.add("morning");
        else if (hour >= 12 && hour < 17) document.body.classList.add("day");
        else if (hour >= 17 && hour < 20) document.body.classList.add("sunset");
        else document.body.classList.add("night");
    }
    function setMode(mode, btn) {
        document.querySelectorAll(".weather-controls button:not(:last-child)").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        const isRaining = document.body.classList.contains("raining");
        if (mode === "auto") { autoTime = true; applySkyByHour(new Date().getHours()); }
        else { autoTime = false; document.body.className = (isRaining ? "raining " : "") + mode; }
    }
    function updateClock() {
        const now = new Date();
        document.getElementById("clock").textContent = now.toLocaleTimeString("el-GR", { hour: "2-digit", minute: "2-digit" });
        document.getElementById("date").textContent = now.toLocaleDateString("el-GR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
        if (autoTime) applySkyByHour(now.getHours());
    }
    updateClock();
    setInterval(updateClock, 1000);

    // Realistic Canvas Rain Animation
    const canvas = document.getElementById("rain-canvas");
    const ctx = canvas.getContext("2d");
    let isRaining = false;
    let drops = [];
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();
    for (let i = 0; i < 180; i++) {
        drops.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, len: Math.random() * 18 + 10, speed: Math.random() * 8 + 7, opacity: Math.random() * 0.4 + 0.2 });
    }
    function animateRain() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (isRaining) {
            ctx.strokeStyle = "rgba(220, 238, 255, 0.55)";
            ctx.lineWidth = 1.2;
            drops.forEach(d => {
                ctx.beginPath();
                ctx.moveTo(d.x, d.y);
                ctx.lineTo(d.x - 2.5, d.y + d.len);
                ctx.stroke();
                d.y += d.speed;
                d.x -= 1.2;
                if (d.y > canvas.height) { d.y = -20; d.x = Math.random() * canvas.width; }
            });
        }
        requestAnimationFrame(animateRain);
    }
    animateRain();
    function toggleRain(btn) {
        isRaining = !isRaining;
        document.body.classList.toggle("raining");
        btn.classList.toggle("active");
    }

    // Floating Golden Light Motes
    const motesEl = document.getElementById("motes");
    for (let i = 0; i < 20; i++) {
        const m = document.createElement("div");
        m.className = "mote";
        const s = Math.random() * 12 + 5;
        m.style.width = s + "px"; m.style.height = s + "px";
        m.style.left = Math.random() * 100 + "vw";
        m.style.animationDuration = (Math.random() * 12 + 10) + "s";
        m.style.animationDelay = (Math.random() * 8) + "s";
        motesEl.appendChild(m);
    }

    // Guaranteed Audio Engine (Web Audio Synth + Live Radio Stream)
    let audioCtx = null, masterGain = null, noiseNode = null, chordInterval = null;
    let isPlaying = false, currentChannel = 0;
    const streamAudio = document.getElementById("stream-audio");
    const playBtn = document.getElementById("play-btn");
    const statusEl = document.getElementById("radio-status");

    function startAmbientSynth(type) {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        stopAllAudio();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = document.getElementById("vol-slider").value * 0.4;
        masterGain.connect(audioCtx.destination);

        // Soft Pink/Brown Noise for Ocean Waves or Rain
        const bufferSize = 2 * audioCtx.sampleRate;
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        let lastOut = 0.0;
        for (let i = 0; i < bufferSize; i++) {
            const white = Math.random() * 2 - 1;
            output[i] = (lastOut + (0.02 * white)) / 1.02;
            lastOut = output[i];
            output[i] *= 2.5;
        }
        noiseNode = audioCtx.createBufferSource();
        noiseNode.buffer = noiseBuffer;
        noiseNode.loop = true;

        const filter = audioCtx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.value = type === "rain" ? 900 : 320;
        noiseNode.connect(filter);
        filter.connect(masterGain);
        noiseNode.start();

        // Soft Gentle Piano Chords if channel 0
        if (type === "waves_piano") {
            const notes = [261.63, 329.63, 392.00, 493.88, 293.66, 349.23, 440.00];
            chordInterval = setInterval(() => {
                if (!isPlaying) return;
                const osc = audioCtx.createOscillator();
                const noteGain = audioCtx.createGain();
                osc.type = "sine";
                osc.frequency.value = notes[Math.floor(Math.random() * notes.length)];
                noteGain.gain.setValueAtTime(0.001, audioCtx.currentTime);
                noteGain.gain.exponentialRampToValueAtTime(0.18, audioCtx.currentTime + 0.8);
                noteGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 4.5);
                osc.connect(noteGain);
                noteGain.connect(masterGain);
                osc.start();
                osc.stop(audioCtx.currentTime + 4.6);
            }, 3200);
        }
    }

    function stopAllAudio() {
        streamAudio.pause();
        if (noiseNode) { try { noiseNode.stop(); } catch(e){} noiseNode = null; }
        if (chordInterval) { clearInterval(chordInterval); chordInterval = null; }
    }

    function toggleAudio() {
        if (!isPlaying) {
            isPlaying = true;
            playBtn.textContent = "⏸";
            playChannel(currentChannel);
        } else {
            isPlaying = false;
            playBtn.textContent = "▶";
            statusEl.textContent = "Παύση";
            stopAllAudio();
        }
    }

    function selectChannel(idx, btn) {
        currentChannel = idx;
        document.querySelectorAll(".station-pills button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        const names = ["🌊 Κύματα & Απαλό Πιάνο", "🎹 Chill Lounge Radio", "🌧️ Βροχή & Ηρεμία"];
        document.getElementById("station-name").textContent = names[idx];
        if (isPlaying) playChannel(idx);
    }

    function playChannel(idx) {
        stopAllAudio();
        if (idx === 0) {
            statusEl.textContent = "🟢 Παίζει";
            startAmbientSynth("waves_piano");
        } else if (idx === 1) {
            statusEl.textContent = "Σύνδεση...";
            streamAudio.src = "https://laut.fm";
            streamAudio.volume = document.getElementById("vol-slider").value;
            streamAudio.play().then(() => { statusEl.textContent = "🟢 Live Radio"; }).catch(() => {
                statusEl.textContent = "🟢 Παίζει (Ambient)";
                startAmbientSynth("waves_piano");
            });
        } else {
            statusEl.textContent = "🟢 Παίζει";
            startAmbientSynth("rain");
        }
    }

    function updateVolume(val) {
        streamAudio.volume = val;
        if (masterGain) masterGain.gain.value = val * 0.4;
    }
</script>
